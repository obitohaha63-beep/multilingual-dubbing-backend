version: '3.8'

services:
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - content-service
      - translate-audio-service
    restart: always

  content-service:
    build:
      context: ./content-service
      dockerfile: Dockerfile
    container_name: content-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - content_db_data:/app/data
    restart: always

  translate-audio-service:
    build:
      context: ./translate-audio-service
      dockerfile: Dockerfile
    container_name: translate-audio-service
    ports:
      - "8002:8002"
    env_file:
      - .env
    volumes:
      - audio_cache_data:/app/audio
    restart: always

volumes:
  content_db_data:
    name: content_db_data
  audio_cache_data:
    name: audio_cache_data
