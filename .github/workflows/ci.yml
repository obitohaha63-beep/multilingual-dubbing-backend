
name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            content-service/requirements.txt
            gateway-service/requirements.txt
            translate-audio-service/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install -r content-service/requirements.txt
          pip install -r gateway-service/requirements.txt
          pip install -r translate-audio-service/requirements.txt

      - name: Run automated tests
        run: python tests/run_checks.py

  docker-build:
    name: Verify Render Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build \
            -f render.Dockerfile \
            -t multilingual-dubbing-backend:ci \
            .
