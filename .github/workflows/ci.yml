
name: Backend CI

on:
  push:
    branches:
      - cong-thanh

  pull_request:
    branches:
      - cong-thanh

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests

    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Cài Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Cài Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 4. Cài dependencies của ba service
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install -r content-service/requirements.txt
          pip install -r gateway-service/requirements.txt
          pip install -r translate-audio-service/requirements.txt

      # 5. Chạy toàn bộ automated tests
      - name: Run automated tests
        run: |
          python tests/run_checks.py

  docker-build:
    name: Verify Render Docker Image

    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Kiểm tra Dockerfile dành cho Render
      - name: Build Docker image
        run: |
          docker build \
            -f render.Dockerfile \
            -t multilingual-dubbing-backend:ci \
            .
