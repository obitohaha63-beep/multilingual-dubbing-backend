[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

; ── content-service (port 8001) ──────────────────────────────────────────────
[program:content-service]
command=python -m uvicorn main:app --host 127.0.0.1 --port 8001 --log-level info
directory=/app/content-service
autostart=true
autorestart=true
; startretries: so lan thu lai khi crash (khong phai thu sau tat may)
startretries=5
; startsecs: phai song it nhat N giay moi tinh la khoi dong thanh cong
startsecs=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DB_PATH="/app/data/content.db",WIKIMEDIA_USER_AGENT="%(ENV_WIKIMEDIA_USER_AGENT)s",NARRATION_TTL_DAYS="%(ENV_NARRATION_TTL_DAYS)s"

; ── translate-audio-service (port 8002) ──────────────────────────────────────
[program:translate-audio-service]
command=python -m uvicorn main:app --host 127.0.0.1 --port 8002 --log-level info
directory=/app/translate-audio-service
; Khoi dong sau content-service de content-service san sang truoc khi B can goi A
autostart=true
autorestart=true
startretries=5
startsecs=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=CONTENT_SERVICE_URL="http://127.0.0.1:8001",AUDIO_DIR="/app/audio_files",TTS_TIMEOUT_SECONDS="%(ENV_TTS_TIMEOUT_SECONDS)s",TTS_CONFIG_VERSION="%(ENV_TTS_CONFIG_VERSION)s",TTS_VOICE_VI="%(ENV_TTS_VOICE_VI)s",TTS_VOICE_EN="%(ENV_TTS_VOICE_EN)s",TTS_VOICE_JA="%(ENV_TTS_VOICE_JA)s",WIKIMEDIA_USER_AGENT="%(ENV_WIKIMEDIA_USER_AGENT)s"

; ── gateway-service (port $PORT, Render inject qua env) ──────────────────────
; Dung /bin/sh de chay start.sh - khong phu thuoc quyen +x, xu ly CRLF an toan.
[program:gateway-service]
command=/bin/sh /app/gateway-service/start.sh
directory=/app/gateway-service
; Khoi dong sau 2 service kia de dam bao downstream san sang
autostart=true
autorestart=true
startretries=5
; startsecs giam xuong 3 de tranh FATAL state sớm (Render health-check timeout)
startsecs=3
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; PORT duoc Render inject vao container env - phai forward xuong process nay
environment=CONTENT_SERVICE_URL="http://127.0.0.1:8001",TTS_SERVICE_URL="http://127.0.0.1:8002",GATEWAY_TIMEOUT="%(ENV_GATEWAY_TIMEOUT)s",GATEWAY_NARRATE_TIMEOUT="%(ENV_GATEWAY_NARRATE_TIMEOUT)s",PORT="%(ENV_PORT)s",ADMIN_PATH="%(ENV_ADMIN_PATH)s",ADMIN_USERNAME="%(ENV_ADMIN_USERNAME)s",ADMIN_PASSWORD="%(ENV_ADMIN_PASSWORD)s",ADMIN_SESSION_SECRET="%(ENV_ADMIN_SESSION_SECRET)s",ANALYTICS_DB_PATH="/app/data/analytics.db"
